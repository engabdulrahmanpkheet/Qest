name: qest
description: Qest — Arabic-first installment and subscription manager.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local persistence
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Routing
  go_router: ^14.1.4

  # Notifications + background work
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  workmanager: ^0.5.2
  permission_handler: ^11.3.1

  # OCR
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.1
  file_picker: ^8.0.3

  # Integrations
  url_launcher: ^6.2.6
  device_calendar: ^4.3.2
  local_auth: ^2.2.0

  # Home widgets
  home_widget: ^0.6.0

  # UI / UX
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

  # Utilities
  uuid: ^4.4.0
  collection: ^1.18.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  rxdart: ^0.27.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
