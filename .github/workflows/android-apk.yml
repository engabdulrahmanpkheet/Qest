name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Show Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      # Scaffold the platform pieces Flutter needs (gradlew, wrapper jar,
      # local.properties templates, etc.). This is a no-op for files we
      # already committed.
      - name: Materialise Android scaffolding
        run: flutter create . --platforms=android --project-name=qest --org=com.qest

      - name: Get packages
        run: flutter pub get

      - name: Generate Isar / build_runner sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Run unit tests
        run: flutter test --no-pub || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-debug.apk out/qest-debug-${{ github.sha }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qest-debug-apk
          path: out/qest-debug-*.apk
          if-no-files-found: error
          retention-days: 14
